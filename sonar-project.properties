# SonarQube Cloud analysis, run by the SonarQube Cloud job in .github/workflows/CI.yml.
sonar.host.url=https://sonarcloud.io
sonar.organization=cucumberswift
sonar.projectKey=cucumberswift_CucumberSwiftExpressions

sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
# The DocC catalog is documentation.
sonar.exclusions=Sources/CucumberSwiftExpressions/CucumberSwiftExpressions.docc/**

# Written by the test job from its swift test coverage (.github/scripts/sonar_coverage.py).
sonar.coverageReportPaths=sq-generic.xml
