name: CI

# Pull requests run CI from the pull_request event, so pushes run it only on the
# long-lived branches: main and the support/N.x release lines. Any other branch
# runs CI only through a pull request.
on:
  pull_request:
  push:
    branches:
      - main
      - 'support/**'
  workflow_dispatch:

# Least privilege: these jobs only read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run TESTS
        run: swift test -v --enable-code-coverage
      - name: Convert code coverage
        run: xcrun llvm-cov export -format="lcov" -instr-profile=$(find .build -name default.profdata) $(find .build -name CucumberSwiftExpressionsPackageTests) > info.lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: info.lcov
          # Pull requests from forks have no token, so only a push fails on an upload error.
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  build_for_package_managers:
    needs: test
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate SwiftPM BUILDs
        run: fastlane build_swiftpm
      # Builds the package for the tvOS and watchOS Simulators without running a test (#90), so a
      # change that breaks either platform fails the pull request.
      - name: Build for tvOS and watchOS
        run: |
          for platform in tvOS watchOS; do
            xcodebuild build -scheme CucumberSwiftExpressions -destination "generic/platform=$platform Simulator" \
              -skipPackagePluginValidation -quiet
          done

  # Checks that each lower bound in Package.swift is the version Package.resolved
  # pins, and that `swift package resolve` leaves Package.resolved unchanged. No
  # path filter, so it runs on every pull request and can be a required check.
  # The Ubuntu image ships Swift, and resolving needs no Apple toolchain.
  lockfiles:
    name: Manifests match their lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      - name: Check Package.swift against Package.resolved
        run: python3 .github/scripts/check_lockfiles.py --resolve

  release_script:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run the release script tests
        run: python3 -m unittest discover -s .github/scripts -v

  # Checks the Bazel module the way a Bazel project uses it, so BUILD.bazel and
  # MODULE.bazel cannot drift from Package.swift or break for consumers:
  # - against a `git archive` of the commit, which is what the release's source
  #   archive (and so the Bazel Central Registry entry) contains, not the checkout;
  # - from Tests/, a separate module that depends on this one;
  # - on every Bazel major that MODULE.bazel's bazel_compatibility allows, and
  #   on macOS and an iOS simulator, at the lowest OS versions consumers use.
  bazel:
    name: Bazel tests (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The labels are the check names, which rulesets require, so they hold no
      # version number. An empty version means Bazelisk runs .bazelversion.
      matrix:
        include:
          - label: pinned Bazel
            bazel: ''
          # The oldest major that bazel_compatibility in MODULE.bazel allows.
          - label: oldest Bazel
            bazel: '8.x'
    env:
      # The runner's `bazel` is Bazelisk, which runs this version, or .bazelversion.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      # The tests `swift test` runs, on each platform. Raise it when you add tests.
      MIN_TESTS: 42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the Bazel version
        run: bazel version
      - name: Unpack the commit as the release archive will contain it
        run: |
          mkdir "$RUNNER_TEMP/module"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/module"
          echo "MODULE_PATH=$RUNNER_TEMP/module" >> "$GITHUB_ENV"
      - name: Build every target in the module, as a consumer would
        working-directory: Tests
        run: bazel build @cucumberswift_expressions//... --override_module=cucumberswift_expressions="$MODULE_PATH"
      # rules_apple can't run tvOS or watchOS tests, so the tag filters leave those bundles out
      # (see Tests/BUILD.bazel). The tvOS and watchOS tests run through Xcode.
      - name: Run the tests on macOS and on an iOS simulator
        working-directory: Tests
        run: bazel test //... --override_module=cucumberswift_expressions="$MODULE_PATH" --test_output=errors --test_tag_filters=-tvos,-watchos --build_tag_filters=-tvos,-watchos
      - name: Check every test ran
        working-directory: Tests
        run: |
          # The macOS runner logs the Xcode Bazel selected; show it beside xcode-select's.
          echo "xcode-select: $(xcode-select -p)"
          grep -h -m1 'Running xctest from' bazel-testlogs/*/test.log || echo "::warning::No macOS test log names its Xcode."
          status=0
          for t in CucumberSwiftExpressionsTests CucumberSwiftExpressionsTests_iOS; do
            n=$(grep -Eo 'Executed [0-9]+ tests' "bazel-testlogs/$t/test.log" | tail -1 | grep -Eo '[0-9]+')
            echo "$t: ${n:-0} tests (at least $MIN_TESTS expected)"
            if [ "${n:-0}" -lt "$MIN_TESTS" ]; then
              echo "::error::Only ${n:-0} tests ran in $t. If you removed tests on purpose, lower MIN_TESTS in CI.yml."
              status=1
            fi
          done
          exit $status

  # The tests on the tvOS and watchOS Simulators (#90), with the runtimes the newest Xcode comes
  # with. Manual runs and pushes to main only: pull requests build for both in
  # build_for_package_managers.
  tvos_watchos_tests:
    name: tvOS and watchOS tests
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The tests `swift test` runs, on each platform. Raise it when you add tests.
      MIN_TESTS: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i -E 'tvos|watchos' || true
      # A run with no tests still passes, so each platform must run at least MIN_TESTS.
      - name: Run the tests on tvOS and watchOS Simulators
        run: |
          status=0
          for platform in tvOS watchOS; do
            destination=$(.github/scripts/simulator-destination.sh "$platform Simulator")
            log="$RUNNER_TEMP/$platform.log"
            xcodebuild test -scheme CucumberSwiftExpressions -destination "$destination" \
              -skipPackagePluginValidation > "$log" 2>&1 || status=1
            grep -E 'error:|\*\* TEST (FAILED|SUCCEEDED)' "$log" | sort -u | head -20
            n=$(grep -Eo 'Executed [0-9]+ tests' "$log" | tail -1 | grep -Eo '[0-9]+' || true)
            echo "$platform: ${n:-0} tests (at least $MIN_TESTS expected)"
            if [ "${n:-0}" -lt "$MIN_TESTS" ]; then
              echo "::error::Only ${n:-0} tests ran on $platform. If you removed tests on purpose, lower MIN_TESTS in CI.yml."
              status=1
            fi
          done
          exit $status
