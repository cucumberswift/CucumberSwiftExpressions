name: CI

# Pull requests run CI from the pull_request event, so pushes run it only on the
# long-lived branches: main and the support/N.x release lines. Any other branch
# runs CI only through a pull request.
on:
  pull_request:
  push:
    branches:
      - main
      - 'support/**'
  workflow_dispatch:

# Least privilege: these jobs only read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v2
      - name: Run TESTS
        run: swift test -v --enable-code-coverage
      - name: Convert code coverage
        run: xcrun llvm-cov export -format="lcov" -instr-profile=$(find .build -name default.profdata) $(find .build -name CucumberSwiftExpressionsPackageTests) > info.lcov
      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: info.lcov
          # Pull requests from forks have no token, so only a push fails on an upload error.
          fail_ci_if_error: ${{ github.event_name == 'push' }}
      # The sonarqube job reads this report. Paths in it are relative to the
      # repository root, so it does not depend on where that job checks out.
      - name: Convert coverage for SonarQube Cloud
        run: python3 .github/scripts/sonar_coverage.py --lcov info.lcov --root . --include Sources --output sq-generic.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage
          path: sq-generic.xml
          if-no-files-found: error
          retention-days: 1

  # Code analysis and coverage on SonarQube Cloud (sonar-project.properties).
  # Pull requests from forks get no secrets, so they skip it.
  sonarqube:
    name: SonarQube Cloud
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud uses the history to tell new code from old.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage
      - name: Install sonar-scanner
        run: |
          brew install sonar-scanner
          sonar-scanner --version
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner

  build_for_package_managers:
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v2
      - name: Validate SwiftPM BUILDs
        run: fastlane build_swiftpm

  release_script:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run the release script tests
        run: python3 -m unittest discover -s .github/scripts -v
