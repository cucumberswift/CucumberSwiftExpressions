name: CI

# Pull requests run CI from the pull_request event, so pushes run it only on the
# long-lived branches: main and the support/N.x release lines. Any other branch
# runs CI only through a pull request.
on:
  pull_request:
  push:
    branches:
      - main
      - 'support/**'
  workflow_dispatch:

# Least privilege: these jobs only read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run TESTS
        run: swift test -v --enable-code-coverage
      - name: Convert code coverage
        run: xcrun llvm-cov export -format="lcov" -instr-profile=$(find .build -name default.profdata) $(find .build -name CucumberSwiftExpressionsPackageTests) > info.lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: info.lcov
          # Pull requests from forks have no token, so only a push fails on an upload error.
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  build_for_package_managers:
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate SwiftPM BUILDs
        run: fastlane build_swiftpm

  # Checks that each lower bound in Package.swift is the version Package.resolved
  # pins, and that `swift package resolve` leaves Package.resolved unchanged. No
  # path filter, so it runs on every pull request and can be a required check.
  # The Ubuntu image ships Swift, and resolving needs no Apple toolchain.
  lockfiles:
    name: Manifests match their lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      - name: Check Package.swift against Package.resolved
        run: python3 .github/scripts/check_lockfiles.py --resolve

  release_script:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run the release script tests
        run: python3 -m unittest discover -s .github/scripts -v

  # Builds the library and runs its tests with Bazel, so BUILD.bazel and
  # MODULE.bazel cannot drift from Package.swift.
  bazel:
    name: Bazel tests
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The tests `swift test` runs. Raise it when you add tests.
      MIN_TESTS: 42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's `bazel` is Bazelisk, which runs the version in .bazelversion.
      - name: Show the Bazel version
        run: bazel version
      - name: Build every target in the module
        run: bazel build //...
      # Tests/ is its own module, which depends on this one as a Bazel project would.
      - name: Run the tests through the module as a dependency
        working-directory: Tests
        run: bazel test //:CucumberSwiftExpressionsTests --test_output=errors
      - name: Check every test ran
        working-directory: Tests
        run: |
          n=$(grep -Eo 'Executed [0-9]+ tests' bazel-testlogs/CucumberSwiftExpressionsTests/test.log | tail -1 | grep -Eo '[0-9]+')
          echo "CucumberSwiftExpressionsTests: ${n:-0} tests (at least $MIN_TESTS expected)"
          if [ "${n:-0}" -lt "$MIN_TESTS" ]; then
            echo "::error::Only ${n:-0} tests ran. If you removed tests on purpose, lower MIN_TESTS in CI.yml."
            exit 1
          fi
